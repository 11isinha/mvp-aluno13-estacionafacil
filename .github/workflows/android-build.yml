name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Configurar Java 21 (Exigido pelo Gradle/Capacitor)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Instalar dependências NPM
        run: npm ci

      - name: 5. Compilar projeto Web (Vite + React)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 6. Sincronizar Capacitor Android
        run: npx cap sync android

      - name: 7. Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew

      - name: 8. Gerar APK de Debug
        run: cd android && ./gradlew assembleDebug

      - name: 9. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: EstacionaFacil-MVP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk